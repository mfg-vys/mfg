<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Annual Leave Calculator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
    }

    .page {
        max-width: 1050px;
        margin: 40px auto;
        padding: 0 20px 40px;
    }

    .header {
        margin-bottom: 24px;
    }

    .header h1 {
        margin: 0 0 8px;
        font-size: 34px;
        color: #111827;
    }

    .header p {
        margin: 0;
        color: #6b7280;
        font-size: 16px;
    }

    .card {
        background: white;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 22px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.06);
        border: 1px solid #e5e7eb;
    }

    .section-title {
        margin: 0 0 20px;
        font-size: 22px;
        color: #111827;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 700;
        color: #374151;
    }

    input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 16px;
        background: white;
        transition: 0.2s;
    }

    input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .leave-row {
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 14px;
    }

    .leave-fields {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 14px;
        align-items: end;
    }

    button {
        border: none;
        border-radius: 10px;
        padding: 13px 18px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-1px);
    }

    .btn-primary {
        background: #2563eb;
        color: white;
    }

    .btn-primary:hover {
        background: #1d4ed8;
    }

    .btn-secondary {
        background: #eef2ff;
        color: #3730a3;
    }

    .btn-secondary:hover {
        background: #e0e7ff;
    }

    .btn-remove {
        background: #fee2e2;
        color: #b91c1c;
        white-space: nowrap;
    }

    .btn-remove:hover {
        background: #fecaca;
    }

    .action-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
    }

    .action-row .btn-primary {
        flex: 1;
        min-width: 180px;
    }

    .result-card {
        display: none;
    }

    .summary-box {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 20px;
    }

    .summary-item {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px;
    }

    .summary-label {
        color: #6b7280;
        font-size: 13px;
        margin-bottom: 6px;
    }

    .summary-value {
        font-size: 24px;
        font-weight: 800;
        color: #111827;
    }

    .status {
        padding: 14px 16px;
        border-radius: 12px;
        font-weight: 800;
        margin-bottom: 18px;
        font-size: 17px;
    }

    .status.success {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #bbf7d0;
    }

    .status.error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
    }

    .table-wrap {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        min-width: 720px;
    }

    th {
        text-align: left;
        padding: 12px;
        background: #f3f4f6;
        color: #374151;
        font-size: 13px;
        border-bottom: 1px solid #d1d5db;
    }

    td {
        padding: 13px 12px;
        border-bottom: 1px solid #e5e7eb;
        font-size: 14px;
    }

    th:not(:first-child),
    td:not(:first-child) {
        text-align: right;
    }

    .positive {
        color: #15803d;
        font-weight: 700;
    }

    .negative {
        color: #dc2626;
        font-weight: 700;
    }

    .error-message {
        color: #b91c1c;
        background: #fee2e2;
        border: 1px solid #fecaca;
        padding: 12px;
        border-radius: 10px;
    }

    @media (max-width: 800px) {
        .grid,
        .summary-box {
            grid-template-columns: 1fr;
        }

        .leave-fields {
            grid-template-columns: 1fr;
        }

        .btn-remove {
            width: 100%;
        }

        .header h1 {
            font-size: 28px;
        }
    }
</style>
</head>

<body>

<div class="page">

    <div class="header">
        <h1>Annual Leave Calculator</h1>
        <p>Plan multiple future leave periods and see your projected leave balance.</p>
    </div>

    <div class="card">
        <h2 class="section-title">Current Leave Balance</h2>

        <div class="grid">
            <div>
                <label>Current Leave Balance (hours)</label>
                <input
                    type="number"
                    id="currentBalance"
                    step="0.01"
                    placeholder="e.g. 29.36"
                />
            </div>

            <div>
                <label>Balance As Of Date</label>
                <input type="date" id="balanceDate" />
            </div>
        </div>
    </div>

    <div class="card">
        <h2 class="section-title">Planned Annual Leave</h2>

        <div id="leaveList"></div>

        <div class="action-row">
            <button
                type="button"
                class="btn-secondary"
                onclick="addLeave()"
            >
                + Add Another Leave
            </button>

            <button
                type="button"
                class="btn-primary"
                onclick="calculateLeave()"
            >
                Calculate Leave
            </button>
        </div>
    </div>

    <div class="card result-card" id="resultCard">
        <h2 class="section-title">Leave Projection</h2>
        <div id="result"></div>
    </div>

</div>


<script>

const ACCRUAL_PER_WEEK = 152 / 52;
const ACCRUAL_PER_DAY = ACCRUAL_PER_WEEK / 7;


function parseLocalDate(value) {
    const [year, month, day] = value.split("-").map(Number);
    return new Date(year, month - 1, day);
}


function formatDate(dateValue) {
    const date = parseLocalDate(dateValue);

    return date.toLocaleDateString("en-AU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });
}


function daysBetween(date1, date2) {
    const msPerDay = 1000 * 60 * 60 * 24;

    return Math.max(
        0,
        (date2.getTime() - date1.getTime()) / msPerDay
    );
}


function addLeave(start = "", end = "", hours = "") {

    const leaveList = document.getElementById("leaveList");

    const row = document.createElement("div");

    row.className = "leave-row";

    row.innerHTML = `
        <div class="leave-fields">

            <div>
                <label>Leave Start Date</label>
                <input
                    type="date"
                    class="leaveStart"
                    value="${start}"
                />
            </div>

            <div>
                <label>Leave End Date</label>
                <input
                    type="date"
                    class="leaveEnd"
                    value="${end}"
                />
            </div>

            <div>
                <label>Leave Required (hours)</label>
                <input
                    type="number"
                    class="leaveRequired"
                    step="0.01"
                    placeholder="e.g. 38"
                    value="${hours}"
                />
            </div>

            <button
                type="button"
                class="btn-remove"
                onclick="this.closest('.leave-row').remove()"
            >
                Remove
            </button>

        </div>
    `;

    leaveList.appendChild(row);
}


function showError(message) {

    const resultCard =
        document.getElementById("resultCard");

    const result =
        document.getElementById("result");

    resultCard.style.display = "block";

    result.innerHTML = `
        <div class="error-message">
            ${message}
        </div>
    `;
}


function calculateLeave() {

    const currentBalance =
        parseFloat(
            document.getElementById("currentBalance").value
        );

    const balanceDateValue =
        document.getElementById("balanceDate").value;

    const result =
        document.getElementById("result");

    const resultCard =
        document.getElementById("resultCard");


    if (isNaN(currentBalance)) {
        showError("Please enter your current leave balance.");
        return;
    }


    if (!balanceDateValue) {
        showError("Please enter the date your current balance applies to.");
        return;
    }


    const rows =
        document.querySelectorAll(".leave-row");

    const leaves = [];


    for (const row of rows) {

        const start =
            row.querySelector(".leaveStart").value;

        const end =
            row.querySelector(".leaveEnd").value;

        const hours =
            parseFloat(
                row.querySelector(".leaveRequired").value
            );


        if (!start || !end || isNaN(hours)) {
            continue;
        }


        if (parseLocalDate(end) < parseLocalDate(start)) {

            showError(
                "A leave end date cannot be before its start date."
            );

            return;
        }


        leaves.push({
            start,
            end,
            hours
        });
    }


    if (leaves.length === 0) {

        showError(
            "Please add at least one planned leave period."
        );

        return;
    }


    leaves.sort(
        (a, b) =>
            parseLocalDate(a.start) -
            parseLocalDate(b.start)
    );


    let runningBalance =
        currentBalance;

    let calculationDate =
        parseLocalDate(balanceDateValue);

    let totalLeaveRequired = 0;

    let totalAccrued = 0;

    let allEnough = true;


    let rowsHtml = "";


    leaves.forEach((leave) => {

        const leaveStart =
            parseLocalDate(leave.start);

        const days =
            daysBetween(
                calculationDate,
                leaveStart
            );

        const accrued =
            days * ACCRUAL_PER_DAY;


        totalAccrued += accrued;

        runningBalance += accrued;


        const availableBeforeLeave =
            runningBalance;


        runningBalance -= leave.hours;


        totalLeaveRequired += leave.hours;


        const enough =
            runningBalance >= 0;


        if (!enough) {
            allEnough = false;
        }


        rowsHtml += `
            <tr>

                <td>
                    ${formatDate(leave.start)}
                    –
                    ${formatDate(leave.end)}
                </td>

                <td>
                    +${accrued.toFixed(2)}
                </td>

                <td>
                    ${availableBeforeLeave.toFixed(2)}
                </td>

                <td>
                    -${leave.hours.toFixed(2)}
                </td>

                <td class="${enough ? "positive" : "negative"}">
                    ${runningBalance.toFixed(2)}
                </td>

            </tr>
        `;


        calculationDate =
            leaveStart;
    });


    resultCard.style.display =
        "block";


    result.innerHTML = `

        <div class="summary-box">

            <div class="summary-item">
                <div class="summary-label">
                    Starting Balance
                </div>

                <div class="summary-value">
                    ${currentBalance.toFixed(2)}
                </div>

                <div class="summary-label">
                    hours
                </div>
            </div>


            <div class="summary-item">
                <div class="summary-label">
                    Total Leave Planned
                </div>

                <div class="summary-value">
                    ${totalLeaveRequired.toFixed(2)}
                </div>

                <div class="summary-label">
                    hours
                </div>
            </div>


            <div class="summary-item">
                <div class="summary-label">
                    Projected Balance
                </div>

                <div class="summary-value">
                    ${runningBalance.toFixed(2)}
                </div>

                <div class="summary-label">
                    hours remaining
                </div>
            </div>

        </div>


        <div class="status ${allEnough ? "success" : "error"}">

            ${
                allEnough
                    ? "✅ You will have enough annual leave for all planned leave."
                    : "❌ You will not have enough annual leave for all planned leave."
            }

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>Leave Period</th>
                        <th>Accrued</th>
                        <th>Available</th>
                        <th>Leave Used</th>
                        <th>Remaining</th>
                    </tr>

                </thead>

                <tbody>

                    ${rowsHtml}

                </tbody>

            </table>

        </div>


        <p style="
            margin-top:18px;
            color:#6b7280;
            font-size:13px;
        ">
            Annual leave accrual used:
            ${ACCRUAL_PER_WEEK.toFixed(3)} hours per week.
        </p>
    `;
}


document.addEventListener(
    "DOMContentLoaded",
    function () {

        const today =
            new Date();

        const yyyy =
            today.getFullYear();

        const mm =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");

        const dd =
            String(
                today.getDate()
            ).padStart(2, "0");


        document.getElementById(
            "balanceDate"
        ).value =
            `${yyyy}-${mm}-${dd}`;


        addLeave();
    }
);

</script>

</body>
</html>
