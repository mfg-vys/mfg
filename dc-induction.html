<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DC New Starter Induction</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #f2f4f7;
        font-family: Arial, sans-serif;
        color: #222;
    }

    .container {
        max-width: 750px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    h1 {
        margin-top: 0;
        margin-bottom: 5px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 30px;
    }

    .field {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input[type="text"],
    input[type="date"] {
        width: 100%;
        padding: 13px;
        font-size: 16px;
        border: 1px solid #bbb;
        border-radius: 6px;
    }

    h2 {
        margin-top: 30px;
    }

    .check-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
        margin-bottom: 10px;
        background: #f5f6f7;
        border-radius: 7px;
    }

    .check-item input {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
    }

    .check-item label {
        font-weight: normal;
        margin: 1px 0 0 0;
    }

    canvas {
        width: 100%;
        height: 170px;
        display: block;
        background: white;
        border: 2px solid #bbb;
        border-radius: 7px;
        touch-action: none;
    }

    .clear-button {
        background: #e4e4e4;
        border: 0;
        padding: 10px 16px;
        margin-top: 8px;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
    }

    .complete-button {
        width: 100%;
        padding: 17px;
        margin-top: 35px;
        border: 0;
        border-radius: 7px;
        background: #111;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    .complete-button:active {
        transform: scale(0.99);
    }

    #message {
        margin-top: 20px;
        padding: 15px;
        display: none;
        border-radius: 6px;
        line-height: 1.5;
    }

    .error {
        display: block !important;
        background: #ffe4e4;
        color: #a40000;
    }

    .success {
        display: block !important;
        background: #e4f7e8;
        color: #146c2e;
    }

</style>
</head>


<body>

<div class="container">

    <h1>New Starter Induction</h1>

    <div class="subtitle">
        DC Induction Record
    </div>


    <!-- EMPLOYEE -->

    <div class="field">

        <label>
            New Starter Name
        </label>

        <input
            type="text"
            id="employeeName"
            placeholder="Enter full name">

    </div>


    <!-- COORDINATOR -->

    <div class="field">

        <label>
            Coordinator
        </label>

        <input
            type="text"
            id="coordinator"
            placeholder="Enter coordinator name">

    </div>


    <!-- DATE -->

    <div class="field">

        <label>
            Induction Date
        </label>

        <input
            type="date"
            id="inductionDate">

    </div>



    <!-- CHECKLIST -->

    <h2>
        Induction Checklist
    </h2>


    <div class="check-item">

        <input
            type="checkbox"
            id="check1">

        <label for="check1">

            Site tour and emergency exits have been explained.

        </label>

    </div>


    <div class="check-item">

        <input
            type="checkbox"
            id="check2">

        <label for="check2">

            PPE and safety footwear requirements have been explained.

        </label>

    </div>



    <!-- EMPLOYEE SIGNATURE -->

    <h2>
        New Starter Signature
    </h2>

    <canvas id="employeeSignature"></canvas>

    <button
        class="clear-button"
        type="button"
        onclick="clearSignature('employeeSignature')">

        Clear Signature

    </button>



    <!-- COORDINATOR SIGNATURE -->

    <h2>
        Coordinator Signature
    </h2>

    <canvas id="coordinatorSignature"></canvas>

    <button
        class="clear-button"
        type="button"
        onclick="clearSignature('coordinatorSignature')">

        Clear Signature

    </button>



    <!-- COMPLETE -->

    <button
        class="complete-button"
        type="button"
        onclick="completeInduction()">

        Complete & Email Induction

    </button>


    <div id="message"></div>

</div>



<script>

const { jsPDF } = window.jspdf;


/*
---------------------------------------------------------
SET TODAY'S DATE
---------------------------------------------------------
*/

document.getElementById("inductionDate").value =
    new Date().toISOString().split("T")[0];



/*
---------------------------------------------------------
EMAIL SETTINGS
---------------------------------------------------------
*/

const EMAIL_ADDRESS =
    "vys.ing@munrofg.com";



/*
---------------------------------------------------------
SIGNATURE STATUS
---------------------------------------------------------
*/

const signatureState = {

    employeeSignature: false,

    coordinatorSignature: false

};



/*
---------------------------------------------------------
SETUP SIGNATURE PAD
---------------------------------------------------------
*/

function setupSignature(canvasId) {

    const canvas =
        document.getElementById(canvasId);

    const ctx =
        canvas.getContext("2d");


    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        canvas.offsetWidth * ratio;

    canvas.height =
        canvas.offsetHeight * ratio;


    ctx.scale(
        ratio,
        ratio
    );


    ctx.lineWidth = 2;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle = "#000";


    let drawing = false;



    function position(event) {

        const rect =
            canvas.getBoundingClientRect();


        return {

            x:
                event.clientX -
                rect.left,

            y:
                event.clientY -
                rect.top

        };

    }



    canvas.addEventListener(
        "pointerdown",
        function(event) {

            drawing = true;

            signatureState[canvasId] =
                true;


            canvas.setPointerCapture(
                event.pointerId
            );


            const pos =
                position(event);


            ctx.beginPath();

            ctx.moveTo(
                pos.x,
                pos.y
            );

        }
    );



    canvas.addEventListener(
        "pointermove",
        function(event) {

            if (!drawing) {
                return;
            }


            const pos =
                position(event);


            ctx.lineTo(
                pos.x,
                pos.y
            );


            ctx.stroke();

        }
    );



    canvas.addEventListener(
        "pointerup",
        function() {

            drawing = false;

        }
    );



    canvas.addEventListener(
        "pointercancel",
        function() {

            drawing = false;

        }
    );

}



/*
---------------------------------------------------------
CLEAR SIGNATURE
---------------------------------------------------------
*/

function clearSignature(canvasId) {

    const canvas =
        document.getElementById(canvasId);

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    signatureState[canvasId] =
        false;

}



/*
---------------------------------------------------------
MESSAGE
---------------------------------------------------------
*/

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById("message");


    message.className =
        type;


    message.textContent =
        text;

}



/*
---------------------------------------------------------
COMPLETE INDUCTION
---------------------------------------------------------
*/

async function completeInduction() {


    /*
    GET INFORMATION
    */

    const employee =
        document
            .getElementById("employeeName")
            .value
            .trim();


    const coordinator =
        document
            .getElementById("coordinator")
            .value
            .trim();


    const date =
        document
            .getElementById("inductionDate")
            .value;


    const check1 =
        document
            .getElementById("check1")
            .checked;


    const check2 =
        document
            .getElementById("check2")
            .checked;



    /*
    VALIDATION
    */


    if (!employee) {

        showMessage(
            "Please enter the new starter's name.",
            "error"
        );

        return;

    }



    if (!coordinator) {

        showMessage(
            "Please enter the coordinator's name.",
            "error"
        );

        return;

    }



    if (!date) {

        showMessage(
            "Please select the induction date.",
            "error"
        );

        return;

    }



    if (!check1 || !check2) {

        showMessage(
            "Please complete all induction checklist items.",
            "error"
        );

        return;

    }



    if (
        !signatureState.employeeSignature
    ) {

        showMessage(
            "The new starter must sign the induction.",
            "error"
        );

        return;

    }



    if (
        !signatureState.coordinatorSignature
    ) {

        showMessage(
            "The coordinator must sign the induction.",
            "error"
        );

        return;

    }



    /*
    -----------------------------------------------------
    CREATE PDF
    -----------------------------------------------------
    */


    const pdf =
        new jsPDF({

            orientation:
                "portrait",

            unit:
                "mm",

            format:
                "a4"

        });



    /*
    TITLE
    */


    pdf.setFontSize(20);

    pdf.text(
        "New Starter Induction",
        20,
        20
    );


    pdf.setFontSize(11);

    pdf.text(
        "DC Induction Record",
        20,
        28
    );



    /*
    EMPLOYEE DETAILS
    */


    pdf.setFontSize(12);


    pdf.text(
        "New Starter:",
        20,
        45
    );


    pdf.text(
        employee,
        55,
        45
    );


    pdf.text(
        "Coordinator:",
        20,
        54
    );


    pdf.text(
        coordinator,
        55,
        54
    );


    pdf.text(
        "Date:",
        20,
        63
    );


    pdf.text(
        date,
        55,
        63
    );



    /*
    CHECKLIST
    */


    pdf.setFontSize(15);


    pdf.text(
        "Induction Checklist",
        20,
        80
    );


    pdf.setFontSize(11);


    pdf.text(
        "[X] Site tour and emergency exits have been explained.",
        20,
        92
    );


    pdf.text(
        "[X] PPE and safety footwear requirements have been explained.",
        20,
        102
    );



    /*
    EMPLOYEE SIGNATURE
    */


    pdf.setFontSize(13);


    pdf.text(
        "New Starter Signature",
        20,
        125
    );


    const employeeCanvas =
        document.getElementById(
            "employeeSignature"
        );


    const employeeImage =
        employeeCanvas.toDataURL(
            "image/png"
        );


    pdf.addImage(
        employeeImage,
        "PNG",
        20,
        130,
        75,
        30
    );


    pdf.line(
        20,
        163,
        95,
        163
    );



    /*
    COORDINATOR SIGNATURE
    */


    pdf.text(
        "Coordinator Signature",
        110,
        125
    );


    const coordinatorCanvas =
        document.getElementById(
            "coordinatorSignature"
        );


    const coordinatorImage =
        coordinatorCanvas.toDataURL(
            "image/png"
        );


    pdf.addImage(
        coordinatorImage,
        "PNG",
        110,
        130,
        75,
        30
    );


    pdf.line(
        110,
        163,
        185,
        163
    );



    /*
    COMPLETION TIME
    */


    const completed =
        new Date().toLocaleString();


    pdf.setFontSize(9);


    pdf.text(
        "Completed: " + completed,
        20,
        180
    );



    /*
    -----------------------------------------------------
    CREATE PDF IN MEMORY
    -----------------------------------------------------
    */


    const pdfBlob =
        pdf.output("blob");



    /*
    CREATE SAFE FILE NAME
    */


    const safeName =
        employee.replace(
            /[^a-z0-9]/gi,
            "_"
        );


    const fileName =
        safeName +
        "_Induction_" +
        date +
        ".pdf";



    /*
    CREATE FILE
    */


    const pdfFile =
        new File(

            [pdfBlob],

            fileName,

            {
                type:
                    "application/pdf"
            }

        );



    /*
    -----------------------------------------------------
    EMAIL DETAILS
    -----------------------------------------------------
    */


    const emailSubject =
        "Completed DC Induction - " +
        employee;


    const emailBody =
        "Please find attached the completed DC induction for " +
        employee +
        ".";



    /*
    -----------------------------------------------------
    COPY EMAIL ADDRESS
    -----------------------------------------------------
    */


    try {

        await navigator.clipboard.writeText(
            EMAIL_ADDRESS
        );

    }

    catch (error) {

        console.log(
            "Could not copy email address."
        );

    }



    /*
    -----------------------------------------------------
    ANDROID SHARE
    -----------------------------------------------------
    */


    const shareData = {

        title:
            emailSubject,

        text:
            emailBody,

        files: [
            pdfFile
        ]

    };



    /*
    CHECK FILE SHARING SUPPORT
    */


    if (

        navigator.canShare &&

        navigator.canShare({
            files: [pdfFile]
        })

    ) {


        try {


            /*
            OPEN ANDROID SHARE MENU
            */


            await navigator.share(
                shareData
            );



            /*
            SUCCESS
            */


            showMessage(

                "Induction completed. " +
                "The PDF has been attached. " +
                EMAIL_ADDRESS +
                " has been copied — paste it into the To field in Outlook.",

                "success"

            );


        }

        catch (error) {


            /*
            USER CANCELLED
            */


            if (
                error.name !==
                "AbortError"
            ) {

                showMessage(
                    "Unable to open the Android share menu.",
                    "error"
                );

            }

        }

    }

    else {


        showMessage(

            "This browser does not support sharing PDF files. " +
            "Try opening the page in Chrome on the Android tablet.",

            "error"

        );

    }

}



/*
---------------------------------------------------------
START SIGNATURE PADS
---------------------------------------------------------
*/


setupSignature(
    "employeeSignature"
);


setupSignature(
    "coordinatorSignature"
);

</script>

</body>
</html>
